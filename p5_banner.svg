<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220"
     role="img" aria-label="Akashi7766">
  <defs>
    <!-- halftone that drifts slowly -->
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E60012" opacity="0.13"/>
      <animateTransform attributeName="patternTransform" type="translate"
                        values="0,0;12,12" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="glint" x1="0" x2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="220" rx="6"/></clipPath>
    <clipPath id="bar"><rect x="62" y="138" width="380" height="5"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="220" fill="#0B0B0E"/>
    <rect width="1000" height="220" fill="url(#dots)"/>

    <!-- faint starburst turning behind the shards -->
    <g transform="translate(860 110)" opacity="0.07">
      <g fill="#E60012">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                          dur="60s" repeatCount="indefinite"/>
        <path d="M0,0 L320,-14 L320,14 Z"/><path d="M0,0 L-320,-14 L-320,14 Z"/>
        <path d="M0,0 L-14,-320 L14,-320 Z"/><path d="M0,0 L-14,320 L14,320 Z"/>
        <path d="M0,0 L226,-216 L246,-196 Z"/><path d="M0,0 L-226,216 L-246,196 Z"/>
        <path d="M0,0 L226,216 L246,196 Z"/><path d="M0,0 L-226,-216 L-246,-196 Z"/>
      </g>
    </g>

    <!-- shards: slide in, then breathe -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="300,0;0,0"
                        dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,0;-6,0;0,0"
                          dur="5s" begin="1s" repeatCount="indefinite"/>
        <path d="M1000,0 L1000,220 L820,220 L900,0 Z" fill="#E60012"/>
        <path d="M900,0 L820,220 L796,220 L876,0 Z" fill="#0B0B0E"/>
        <path d="M876,0 L796,220 L782,220 L862,0 Z" fill="#E60012">
          <animate attributeName="opacity" values="0.7;0.35;0.7" dur="3.2s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- thin speed lines, low opacity -->
    <g stroke="#E60012" stroke-width="1.2">
      <line x1="-260" y1="36" x2="-40" y2="36" opacity="0">
        <animate attributeName="x1" values="-260;1000" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-40;1220" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.35;0" dur="3.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-320" y1="196" x2="-120" y2="196" opacity="0">
        <animate attributeName="x1" values="-320;1000" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-120;1200" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.25;0" dur="4.8s" begin="1.7s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- name, with a faint misregistered red ghost that flickers occasionally -->
    <g font-family="'Arial Black','Helvetica Neue',Impact,sans-serif" font-weight="900"
       font-style="italic" font-size="68">
      <text x="60" y="122" fill="#E60012" opacity="0">AKASHI7766
        <animate attributeName="opacity" values="0;0;0.45;0;0;0.3;0" keyTimes="0;0.86;0.88;0.9;0.94;0.95;1"
                 dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="60;60;65;60;60;56;60" keyTimes="0;0.86;0.88;0.9;0.94;0.95;1"
                 dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="122" fill="#FFFFFF" opacity="0">AKASHI<tspan fill="#E60012">7766</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
      </text>
    </g>

    <!-- underline: draws in, then a glint sweeps across it -->
    <rect x="62" y="138" height="5" width="0" fill="#E60012">
      <animate attributeName="width" values="0;380" dur="0.7s" begin="0.5s" fill="freeze"
               calcMode="spline" keySplines="0.16 1 0.3 1"/>
    </rect>
    <g clip-path="url(#bar)">
      <rect x="-60" y="138" width="60" height="5" fill="url(#glint)">
        <animate attributeName="x" values="-60;460" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- subtitle words fade in in sequence -->
    <g font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="16" fill="#9A9A9A"
       letter-spacing="2">
      <text x="62" y="174" opacity="0">game dev
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/></text>
      <text x="170" y="174" opacity="0">· mobile
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/></text>
      <text x="270" y="174" opacity="0">· web
        <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.7s" fill="freeze"/></text>
      <rect x="338" y="161" width="9" height="16" fill="#E60012" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
