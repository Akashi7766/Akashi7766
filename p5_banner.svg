<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300"
     role="img" aria-label="Akashi7766 — Persona 5 themed profile banner">
  <title>Akashi7766 — Take Your Code</title>

  <defs>
    <!-- halftone dots, the manga print texture -->
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#E60012" opacity="0.30"/>
      <circle cx="7" cy="7" r="1.0" fill="#E60012" opacity="0.18"/>
    </pattern>

    <!-- red bleed behind type -->
    <filter id="bleed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- everything stays inside the card -->
    <clipPath id="frame">
      <rect x="0" y="0" width="1000" height="300" rx="6"/>
    </clipPath>

    <!-- wipe for the typing line -->
    <clipPath id="typewipe">
      <rect x="92" y="196" width="0" height="34">
        <animate attributeName="width" values="0;470;470;0"
                 keyTimes="0;0.42;0.88;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- ink black ground -->
    <rect width="1000" height="300" fill="#07070A"/>
    <rect width="1000" height="300" fill="url(#halftone)"/>

    <!-- starburst: the Phantom Thieves' kick -->
    <g transform="translate(790 150)" opacity="0.5">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="46s" repeatCount="indefinite"/>
        <path d="M0,0 L300,-16 L300,16 Z" fill="#E60012" opacity="0.30"/>
        <path d="M0,0 L-300,-14 L-300,14 Z" fill="#E60012" opacity="0.22"/>
        <path d="M0,0 L-18,-300 L18,-300 Z" fill="#E60012" opacity="0.26"/>
        <path d="M0,0 L-16,300 L16,300 Z" fill="#E60012" opacity="0.18"/>
        <path d="M0,0 L224,-210 L246,-186 Z" fill="#E60012" opacity="0.24"/>
        <path d="M0,0 L-224,210 L-246,186 Z" fill="#E60012" opacity="0.16"/>
        <path d="M0,0 L224,210 L246,186 Z" fill="#E60012" opacity="0.20"/>
        <path d="M0,0 L-224,-210 L-246,-186 Z" fill="#E60012" opacity="0.14"/>
      </g>
    </g>

    <!-- torn crimson shards, slashing in from the right -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="560,0; 0,0" dur="0.8s" fill="freeze"
                        calcMode="spline" keySplines="0.16 1 0.3 1"/>
      <path d="M1000,0 L1000,300 L612,300 L742,0 Z" fill="#E60012"/>
      <path d="M742,0 L612,300 L574,300 L706,0 Z" fill="#B2000E"/>
      <path d="M706,0 L574,300 L548,300 L682,0 Z" fill="#07070A"/>
      <path d="M682,0 L548,300 L528,300 L664,0 Z" fill="#E60012" opacity="0.85"/>
    </g>

    <!-- speed lines raking across -->
    <g stroke="#E60012" stroke-width="2" opacity="0.55">
      <line x1="-200" y1="46" x2="140" y2="46">
        <animate attributeName="x1" values="-200;1000" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="140;1340" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="2.6s" repeatCount="indefinite"/>
      </line>
      <line x1="-320" y1="262" x2="-40" y2="262">
        <animate attributeName="x1" values="-320;1000" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="-40;1280" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- wordmark -->
    <g font-family="'Arial Black','Helvetica Neue',Impact,sans-serif"
       font-weight="900" font-style="italic">
      <!-- red offset, misregistered print -->
      <text x="68" y="150" font-size="86" fill="#E60012" filter="url(#bleed)" opacity="0.95">
        AKASHI
        <animate attributeName="x" values="68;63;68" dur="4.4s" repeatCount="indefinite"/>
      </text>
      <text x="62" y="146" font-size="86" fill="#FFFFFF">AKASHI</text>
      <!-- black outline so 7766 survives crossing the red shard -->
      <text x="470" y="146" font-size="86" fill="#E60012" stroke="#07070A"
            stroke-width="7" stroke-linejoin="round" paint-order="stroke">7766</text>
    </g>

    <!-- slash under the name -->
    <path d="M64,166 L640,152 L642,176 L66,190 Z" fill="#E60012">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.55s" fill="freeze"/>
    </path>

    <!-- typed line -->
    <g clip-path="url(#typewipe)">
      <text x="92" y="222" font-family="'Consolas','DejaVu Sans Mono',monospace"
            font-size="21" fill="#FFFFFF" letter-spacing="1.5">building things that shouldn't exist yet</text>
    </g>
    <rect x="92" y="200" width="3" height="26" fill="#E60012">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x" values="92;562;562;92" keyTimes="0;0.42;0.88;1"
               dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- calling card -->
    <g transform="rotate(-9 840 232)">
      <rect x="716" y="208" width="250" height="46" fill="#FFFFFF"/>
      <rect x="722" y="214" width="238" height="34" fill="#07070A"/>
      <text x="841" y="238" font-family="'Arial Black',Impact,sans-serif" font-size="18"
            font-weight="900" font-style="italic" fill="#E60012" text-anchor="middle"
            letter-spacing="1">TAKE YOUR CODE</text>
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.045;1" dur="2.8s" repeatCount="indefinite"
                        additive="sum"/>
    </g>

    <!-- torn edge, bottom -->
    <path d="M0,300 L0,286 L40,292 L84,282 L130,294 L178,284 L228,296 L276,286 L330,296
             L384,284 L442,294 L498,282 L556,292 L612,282 L672,294 L730,284 L792,294
             L852,284 L912,294 L1000,286 L1000,300 Z" fill="#E60012"/>

    <rect x="0.5" y="0.5" width="999" height="299" rx="6" fill="none" stroke="#E60012" stroke-width="1.5"/>
  </g>
</svg>
