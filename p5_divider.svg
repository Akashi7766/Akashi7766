<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14"
     role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#E60012" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E60012" stop-opacity="1"/>
      <stop offset="1" stop-color="#E60012" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- slanted rule with a red pulse running along it -->
  <path d="M0,9 L1000,5" stroke="#2A2A30" stroke-width="2"/>
  <rect x="-200" y="4" width="200" height="6" fill="url(#g)" transform="skewX(-30)">
    <animate attributeName="x" values="-200;1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
