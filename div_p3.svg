<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#4FC3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9FD4FF"/>
      <stop offset="1" stop-color="#4FC3FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="13" x2="1000" y2="13" stroke="#1E3A66" stroke-width="2"/>
  <rect x="-180" y="11" width="180" height="4" fill="url(#g)">
    <animate attributeName="x" values="-180;1000" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <!-- the glass breaks where the glint passes the middle -->
  <g transform="translate(500 13)">
    <g stroke="#EAF4FF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.52;0.7;1" dur="4.2s" repeatCount="indefinite"/>
      <path d="M0,0 L-14,-12 M0,0 L10,-13 M0,0 L-11,12 M0,0 L15,11 M0,0 L-26,2 M0,0 L28,-1"/>
    </g>
    <circle r="2" fill="none" stroke="#9FD4FF" opacity="0">
      <animate attributeName="r" values="2;2;22;22" keyTimes="0;0.5;0.68;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.5;0.52;0.68;1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <g fill="#9FD4FF" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.52;0.75;1" dur="4.2s" repeatCount="indefinite"/>
      <polygon points="0,0 5,2 2,6"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-40,-10;-40,-10" keyTimes="0;0.5;0.75;1" dur="4.2s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 4,4 -2,4"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;34,-9;34,-9" keyTimes="0;0.5;0.75;1" dur="4.2s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 6,1 3,5"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-22,10;-22,10" keyTimes="0;0.5;0.75;1" dur="4.2s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 3,5 -3,3"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;46,8;46,8" keyTimes="0;0.5;0.75;1" dur="4.2s" repeatCount="indefinite"/></polygon>
    </g>
  </g>
</svg>
