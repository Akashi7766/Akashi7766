<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="presentation">
  <defs>
    <pattern id="glass" width="26" height="26" patternUnits="userSpaceOnUse">
      <polygon points="6,7 24,7 20,19 2,19" fill="#4FC3FF" fill-opacity="0.1" stroke="#4FC3FF" stroke-opacity="0.35" stroke-width="0.8"/>
    </pattern>
    <pattern id="lit" width="26" height="26" patternUnits="userSpaceOnUse">
      <polygon points="6,7 24,7 20,19 2,19" fill="#9FD4FF" fill-opacity="0.55" stroke="#EAF4FF" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0" stop-color="#1C64F2" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#4FC3FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <clipPath id="trail"><rect x="0" y="0" height="26" width="0">
      <animate attributeName="width" values="0;1000;1000" keyTimes="0;0.35;1" dur="3.8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- strip of glass -->
  <rect width="1000" height="26" fill="url(#glass)"/>

  <!-- panels light up behind the streak, then dim -->
  <g clip-path="url(#trail)">
    <rect width="1000" height="26" fill="url(#lit)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.7;1" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- summon streak -->
  <polygon points="-110,10 0,6 8,13 0,20 -110,16" fill="url(#streak)">
    <animateTransform attributeName="transform" type="translate" values="0,0;1110,0;1110,0"
                      keyTimes="0;0.35;1" dur="3.8s" repeatCount="indefinite"/>
  </polygon>

  <!-- shards break off as it passes -->
  <g fill="#9FD4FF">
    <g transform="translate(200 13)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.063;0.07;0.18;1" dur="3.8s" repeatCount="indefinite"/>
      <polygon points="0,0 6,2 2,6"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-14,-11;-14,-11" keyTimes="0;0.063;0.18;1" dur="3.8s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 5,4 -1,5"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;10,10;10,10" keyTimes="0;0.063;0.18;1" dur="3.8s" repeatCount="indefinite"/></polygon>
    </g>
    <g transform="translate(450 13)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.142;0.15;0.26;1" dur="3.8s" repeatCount="indefinite"/>
      <polygon points="0,0 6,1 3,6"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;12,-12;12,-12" keyTimes="0;0.142;0.26;1" dur="3.8s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 4,5 -2,3"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-12,10;-12,10" keyTimes="0;0.142;0.26;1" dur="3.8s" repeatCount="indefinite"/></polygon>
    </g>
    <g transform="translate(700 13)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.221;0.23;0.34;1" dur="3.8s" repeatCount="indefinite"/>
      <polygon points="0,0 6,2 2,6"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-10,-12;-10,-12" keyTimes="0;0.221;0.34;1" dur="3.8s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 5,4 -1,5"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;14,9;14,9" keyTimes="0;0.221;0.34;1" dur="3.8s" repeatCount="indefinite"/></polygon>
    </g>
    <g transform="translate(900 13)" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.284;0.29;0.4;1" dur="3.8s" repeatCount="indefinite"/>
      <polygon points="0,0 6,1 3,6"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;12,-11;12,-11" keyTimes="0;0.284;0.4;1" dur="3.8s" repeatCount="indefinite"/></polygon>
      <polygon points="0,0 4,5 -2,3"><animateTransform attributeName="transform" type="translate" values="0,0;0,0;-13,11;-13,11" keyTimes="0;0.284;0.4;1" dur="3.8s" repeatCount="indefinite"/></polygon>
    </g>
  </g>

  <!-- crescent moon where the streak exits -->
  <path d="M988,3 A10,10 0 1,0 988,23 A8,8 0 1,1 988,3 Z" fill="#EAF4FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.33;0.37;0.55;1" dur="3.8s" repeatCount="indefinite"/>
  </path>
</svg>
